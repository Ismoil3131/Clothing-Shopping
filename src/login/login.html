<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Shop Login</title>
    <link rel="stylesheet" href="/src/login/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    

</head>
<body>
    <div class="login-container">
        <div class="wrapper">
            <h1>Log in</h1>
            <form class="login">
                <div class="input-group">
                    <input  id="username" type="number" required>
                    <label for="username">Username</label>
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="input-group">
                    <input id="password" type="password" required >
                    <label for="password">Password</label>
                    <i id="show-password" class="bi bi-eye-fill"></i>
                </div>
                <div class="forgot-remember">
                    <label for="remember-me"><input type="checkbox" name="" id="remember-me">Remember Me</label>
                    <a href="">Forgot Password ?</a>
                </div>
                <button id="log-in-btn" type="submit">Log In</button> 
                <div class="dhave-account">
                    <p>Don't have account ?<a href=""> Registrate</a></p>
                </div> 
            </form>
        </div>
    </div>
<script src="/src/login/login.js"></script>
</body>
</html>
