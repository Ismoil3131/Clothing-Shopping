                <div class="pagination">

                <div class="pagination">

            <section id="modal-overlay" class="modal-overlay hidden">
                <div class="overlay-content">
                    <div class="modal-header">
                        <h2 id="modal-title">Add Product</h2>
                        <button type="button" id="modal-close-btn" class="close-btn"><i class="bi bi-x-lg" style="font-size: small;"></i></button>
                    </div>

                    <form id="modal-form">
                        <input type="hidden" id="form-item-id">
                        <div class="form-group">
                            <label for="form-input-title" id="label-title">Product Name</label>
                            <input type="text" id="form-input-title" placeholder="Enter product name" required>
                        </div>
                        <div class="form-group">
                            <label for="form-input-category" id="label-category">Category</label>
                            <input type="text" id="form-input-category" placeholder="Enter category" required>
                        </div>
                        <div class="form-group">
                            <label for="form-input-price" id="label-price">Pieces</label>
                            <input type="number" id="form-input-price" min="0" placeholder="Enter quantity of product" required>
                        </div>
                        <div class="form-group">
                            <label for="form-input-extra" id="label-extra">Price</label>
                            <input type="number" id="form-input-extra" min="0" step="0.01" placeholder="Enter price" required>
                        </div>
                        <div class="form-group" id="group-description">
                            <label for="form-input-description" id="label-description">Description</label>
                            <textarea id="form-input-description" placeholder="Enter product description" rows="3" ></textarea>
                        </div>
                        <div class="form-group" id="group-image">
                            <label for="form-input-file" id="label-image">Product Image</label>
                            <input type="file" id="form-input-file" accept="image/*">
                        </div>
                        <div class="modal-actions">
                            <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
                            <button type="submit" id="modal-submit-btn" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
