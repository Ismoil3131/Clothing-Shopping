<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

            <div class="shop-name">
                <h1>Ketios</h1>
                <p>Premium clothing for everyone</p>
            </div>
            <div class="shop-bucket-login">
                <button class="login-btn"><i class="bi bi-box-arrow-in-right"></i> Login</button>
                <button class="open-shop-card-btn "><i class="bi bi-cart2"></i><span class="order-count">0</span></button>
            </div>
        </div>
    </header>

    <div class="order-products">
        <div class="orders-wrapper">
            <div class="order-header">
                <h2>Shopping Cart</h2>
                <button class="close-shop-card-btn"><i class="bi bi-x "></i></button>
            </div>

            <div class="orders">

            <div class="order-amount">
                    <div class="price">
                        <span>Total</span>
                        <span id="total-price"></span>
                    </div>
                    <button id="buy">Buy</button>
                </div>

            <div class="no-orders">
                <i class="bi bi-cart-x"></i>
                <p>Your cart is empty</p>
            </div>
            
        </div>
    </div>

    <div class="container">
        <section class="filter container">
            <i class="bi bi-funnel"></i>
            <button class="active" type="submit"><a href="index.html"></a>All products</button>
            <button type="submit"><a href="men.html"></a>Men</button>
